name: Release

# Builds Windows installers when a version tag is pushed. Push a tag like
# `v0.1.0` to get a draft GitHub Release with the artifacts attached.
#
# Windows only, deliberately: memento's capture is WASAPI, so a macOS or Linux
# bundle would install, launch, and be unable to record anything. Shipping one
# would be worse than shipping none.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Same checks as on main — a tag must never ship code that fails them.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags, needed to diff commits against the last release.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Same key as ci.yml so both share one cache.
          workspaces: ". -> target"
          # See ci.yml: sherpa-rs-sys' downloaded libs live outside `target` and
          # the cached build script output points at them by absolute path.
          cache-directories: ~/AppData/Local/sherpa-rs
          key: sherpa-cache-v2

      # The bundle filenames and the version shown in the installer come from
      # tauri.conf.json and Cargo.toml, not from the git tag. Stamp both from
      # the tag (v0.2.0 -> 0.2.0) so a release is always correctly versioned
      # without a manual bump landing on main first.
      #
      # The Rust version lives in the *workspace* manifest at the repo root —
      # src-tauri/Cargo.toml only says `version.workspace = true`.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" python3 scripts/stamp_version.py
          echo "--- stamped ---"
          grep -m1 '"version"' src-tauri/tauri.conf.json
          grep -A1 '^\[workspace.package\]' Cargo.toml | grep '^version'

      # Draft release notes: every commit since the previous version tag.
      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$GITHUB_REF_NAME"
          else
            RANGE="$GITHUB_REF_NAME"
          fi
          {
            echo "body<<NOTES_EOF"
            echo "## Changes since ${PREV:-the beginning}"
            echo
            git log --no-merges --pretty=format:"- %s (%h)" "$RANGE"
            echo
            echo
            echo "### Before you install"
            echo
            echo "memento records meeting audio locally. It never joins the call and"
            echo "is not visible to other participants — but recording other people"
            echo "has consent and legal implications that vary by jurisdiction."
            echo
            echo "The installer is unsigned, so SmartScreen will warn on first run."
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # sherpa-onnx is linked as a shared library, so its DLLs have to ship
      # beside the executable or Windows refuses to start the process at all.
      # Tauri bundles only what `bundle.resources` names, and these are not in
      # the repository — sherpa-rs-sys downloads them — so they are built first
      # and staged into the directory the config points at.
      #
      # memento-diar rather than the app: `tauri-build` resolves the resource
      # glob while compiling memento-app and fails when it matches nothing, so
      # the app cannot be what produces the DLLs it needs. Building the crate
      # that pulls sherpa in runs the build script that downloads them.
      - name: Stage the DLLs the installer has to carry
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p memento-diar
          python3 scripts/stage_native_libs.py

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Code signing (optional; set as repo secrets) ---
          # Without these the installer is unsigned and SmartScreen warns on
          # first run. Nothing else breaks.
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "memento ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # NSIS for the ordinary download, MSI for anyone deploying it centrally.
          args: "--bundles nsis,msi"
