name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The pipeline logic. Runs anywhere, which is the point of keeping
  # memento-core dependency-free and OS-free.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System deps for the Tauri app
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # The one that matters while development happens on a Mac: this is the only
  # place the Windows capture code is actually **compiled and linked** against
  # the real Win32 import libraries. `cargo check --target` on a dev machine
  # type-checks it but never links, so it cannot catch a missing library, a
  # wrong feature gate, or a symbol that does not exist in the SDK.
  #
  # It still does not prove the capture *works* — GitHub's runners have no audio
  # device and nothing rendering audio to capture. That verification needs a
  # real Windows machine running `loopback-spike`.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - name: Build everything, including the loopback spike
        run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # Catches Windows-only breakage in the same edit-compile loop a Mac dev has,
  # so the windows job is a backstop rather than the first line of feedback.
  cross-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p memento-audio --target x86_64-pc-windows-msvc --all-targets
