name: CI

# Runs on every push to main and every pull request. Also callable from
# release.yml (`workflow_call`), so a tag build is gated on the same checks
# instead of duplicating them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push to the same ref makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows is both the release target and the only place the WASAPI capture
  # code is actually **compiled and linked** against the real Win32 import
  # libraries. `cargo check --target x86_64-pc-windows-msvc` from a dev Mac
  # type-checks it but never links, so it cannot catch a missing library, a
  # wrong feature gate, or a symbol that is not in the SDK.
  #
  # It still does not prove capture *works*: GitHub runners have no audio device
  # and nothing rendering audio. That needs a real machine and `loopback-spike`.
  rust:
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, so the report script below is one script on every runner.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          # Same key as release.yml so both share one cache. whisper.cpp and
          # sherpa-onnx are expensive to build from cold.
          workspaces: ". -> target"
          # sherpa-rs-sys downloads the prebuilt sherpa-onnx into a *user* cache
          # (`%LOCALAPPDATA%\sherpa-rs`), not into `target`, and bakes that
          # absolute path into the `-L` it emits. On a cache hit its build
          # script does not re-run, so without this the restored build reuses a
          # link search path that does not exist on the fresh runner and the
          # link dies with `LNK1181: cannot open input file 'cargs.lib'`.
          cache-directories: ~/AppData/Local/sherpa-rs
          # Bumped to drop the caches saved before the line above existed —
          # those have a `target` that points at a sherpa dir they don't carry.
          key: sherpa-cache-v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # sherpa-onnx is used as a *shared* library, so its DLLs have to sit next
      # to the test executables in `target/debug/deps`. Putting them there is a
      # side effect of the sherpa-rs-sys build script, and neither half of that
      # survives caching: rust-cache prunes loose files from `target/debug`, and
      # the build script is fingerprint-fresh on a restore so it never re-runs
      # to put them back. The tests then die before `main` with
      # `STATUS_DLL_NOT_FOUND` (exit code 0xc0000135).
      #
      # The download cache the DLLs come from is cached (see above), so copying
      # them across is enough — and it is a no-op on a cold build, where the
      # build script already did it.
      - name: Put the sherpa-onnx DLLs next to the test binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug/deps
          count=0
          while IFS= read -r dll; do
            cp -f "$dll" target/debug/
            cp -f "$dll" target/debug/deps/
            count=$((count + 1))
          done < <(find "$HOME/AppData/Local/sherpa-rs" -name '*.dll' 2>/dev/null || true)
          if [ "$count" -eq 0 ]; then
            echo "::warning::no sherpa-onnx DLLs found — diarization tests may fail to start"
          else
            echo "copied $count DLL(s) into target/debug and target/debug/deps"
          fi

      # `--no-fail-fast` so one failing crate doesn't hide the rest, and the
      # output is kept for the report below.
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/cargo-test.log

      # The installer is only built on a tag, so without this the staging step
      # release.yml depends on would be exercised for the first time while
      # cutting a release — and its failure mode is an app that will not start.
      - name: The installer's DLL staging still works
        run: PROFILE=debug python3 scripts/stage_native_libs.py

      # cargo has no run summary of its own, so the test lines become one here.
      # Runs even when the tests failed — that is when the list is worth most.
      - name: Test report
        if: always()
        run: |
          count() { grep -c "$1" /tmp/cargo-test.log || true; }
          passed=$(count ' \.\.\. ok$')
          failed=$(count ' \.\.\. FAILED$')
          ignored=$(count ' \.\.\. ignored')
          {
            echo "## Cargo Test Report"
            echo
            echo "### Summary"
            if [ "$failed" -eq 0 ]; then
              echo "- Tests: ✅ $passed passed · $((passed + failed + ignored)) total"
            else
              echo "- Tests: ❌ $failed failed · $passed passed · $((passed + failed + ignored)) total"
            fi
            if [ "$ignored" -gt 0 ]; then
              echo "- Ignored: ⚪ $ignored"
            fi
            echo
            # Single quotes are required: the \1 backreferences must reach sed
            # unexpanded by the shell.
            # shellcheck disable=SC2016
            sed -n \
              -e 's/^test \(.*\) \.\.\. ok$/- ✅ `\1`/p' \
              -e 's/^test \(.*\) \.\.\. FAILED$/- ❌ `\1`/p' \
              -e 's/^test \(.*\) \.\.\. ignored.*$/- ⚪ `\1`/p' \
              /tmp/cargo-test.log
          } >> "$GITHUB_STEP_SUMMARY"

  # memento-core is deliberately dependency-free and OS-free, which is what lets
  # the pipeline be developed and tested on a Mac while the target is Windows.
  # That property is easy to lose by accident — one `windows` import or one
  # convenience crate — and this job is what notices.
  portable-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2

      - name: Core builds and tests off Windows
        run: cargo test -p memento-core

      - name: No dependencies crept into the core
        run: |
          deps=$(cargo tree -p memento-core --edges normal --depth 1 | tail -n +2)
          if [ -n "$deps" ]; then
            echo "memento-core must stay dependency-free, but it now depends on:"
            echo "$deps"
            exit 1
          fi

      # The edit-compile loop a dev on macOS actually uses. Catches Windows-only
      # breakage without waiting on the Windows job.
      - name: Windows lanes still type-check from a non-Windows host
        run: cargo check -p memento-audio --target x86_64-pc-windows-msvc --all-targets
