[package]
name = "memento-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "memento_app_lib"
# `rlib` only. Tauri's template also lists `staticlib` and `cdylib`, which exist
# solely so the app can be linked into an iOS or Android host — memento is a
# Windows desktop app and never needs either.
#
# They are not free: an rlib is not linked at all, whereas building a cdylib
# forces every native dependency to resolve at link time. That is what broke the
# Windows build, with sherpa-onnx's prebuilt *shared* distribution reporting a
# `cargs` library it does not actually ship a `cargs.lib` for:
#
#   LINK : fatal error LNK1181: cannot open input file 'cargs.lib'
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memento-core.workspace = true
memento-asr.workspace = true
memento-session.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
memento-audio.workspace = true
